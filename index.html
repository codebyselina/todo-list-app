<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO LIST APP</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <div class="todo-app">

            <h1>TO-DO LIST</h1>
            <div class="stat-container">
                <div class="details">
                    <h3>KEEP IT UP!</h3>
                    <div id="progressbar">
                        <div id="progress"></div>
                    </div>
                </div>
                <div class="stats-number">
                    <p id="numbers">0 / 0</p>
                </div>
            </div>

            <form class="input-area">
                <input type="text" id="task-input" placeholder="Add a new task..">

                <button type="submit" id="add-task-btn">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </form>

            <div class="todos-container">
                <ul id="task-list"></ul>

            <img class="empty-image"
             src="https://cdn-icons-png.flaticon.com/512/3208/3208720.png"
             alt="No tasks">
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@4.2.1/tsparticles.confetti.bundle.min.js"></script>
     <script src="script.js"></script>
</body>
</html>
